{% import '_macros.html' as m with context %}
<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Installation · La Ferme Diobia</title><meta name="theme-color" content="#2E7D32">
<link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body><div class="login-page"><div class="login-card">
  <div class="login-brand"><div class="brand-mark">{{ m.icon('bird', 30) }}</div><h1>Bienvenue</h1><p>Créez le compte administrateur de La Ferme Diobia</p></div>
  {% with msgs = get_flashed_messages(with_categories=true) %}{% for cat, msg in msgs %}<div class="flash flash-{{ cat }} mb-1">{{ msg }}</div>{% endfor %}{% endwith %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group"><label class="form-label">Votre nom</label><input class="form-control" name="nom" required autofocus></div>
    <div class="form-group"><label class="form-label">E-mail (identifiant de connexion)</label><input class="form-control" type="email" name="email" required autocomplete="username"></div>
    <div class="form-group"><label class="form-label">Mot de passe (8 caractères minimum)</label><input class="form-control" type="password" name="password" required minlength="8" autocomplete="new-password"></div>
    <div class="form-group"><label class="form-label">Confirmation</label><input class="form-control" type="password" name="confirmation" required autocomplete="new-password"></div>
    <button class="btn btn-primary btn-lg w-100" style="justify-content:center" type="submit">Créer mon compte</button>
  </form>
</div></div></body></html>
