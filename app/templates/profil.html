{% extends 'base.html' %}
{% block page_title %}Mon profil{% endblock %}
{% block content %}
<div class="card" style="max-width:480px"><div class="card-header"><div class="card-title">Changer mon mot de passe</div></div>
<form method="post" class="card-body"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="form-group"><label class="form-label">Mot de passe actuel</label><input class="form-control" type="password" name="actuel" required></div>
  <div class="form-group"><label class="form-label">Nouveau mot de passe (8 caractères min.)</label><input class="form-control" type="password" name="nouveau" required minlength="8"></div>
  <div class="form-group"><label class="form-label">Confirmation</label><input class="form-control" type="password" name="confirmation" required></div>
  <div class="form-actions"><button class="btn btn-primary">Enregistrer</button></div>
</form></div>
{% endblock %}
