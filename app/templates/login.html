{% import '_macros.html' as m with context %}
<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion · La Ferme Diobia</title><meta name="theme-color" content="#2E7D32"><link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body><div class="login-page"><div class="login-card">
  <div class="login-brand"><div class="brand-mark">{{ m.icon('bird', 30) }}</div><h1>La Ferme Diobia</h1><p>ERP avicole · achats, transformation, ventes et finances</p></div>
  {% with msgs = get_flashed_messages(with_categories=true) %}{% for cat, msg in msgs %}<div class="flash flash-{{ cat }} mb-1">{{ msg }}</div>{% endfor %}{% endwith %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group"><label class="form-label">E-mail</label><input class="form-control" type="email" name="email" required autofocus autocomplete="username"></div>
    <div class="form-group"><label class="form-label">Mot de passe</label><input class="form-control" type="password" name="password" required autocomplete="current-password"></div>
    <label class="chk mb-1"><input type="checkbox" name="remember"> Rester connecté sur cet appareil</label>
    <button class="btn btn-primary btn-lg w-100" style="justify-content:center" type="submit">Se connecter</button>
  </form>
</div></div></body></html>
