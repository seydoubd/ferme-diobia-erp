{% extends 'base.html' %}
{% block page_title %}{{ titre }}{% endblock %}
{% block content %}
<div class="card" style="max-width:520px;margin:3rem auto"><div class="card-body text-center" style="padding:2.5rem">
  <div style="font-size:3rem;font-weight:800;color:var(--orange)">{{ code }}</div>
  <h2 style="margin:.5rem 0">{{ titre }}</h2><p class="text-muted">{{ message }}</p>
  <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary mt-2">Retour au tableau de bord</a>
</div></div>
{% endblock %}
